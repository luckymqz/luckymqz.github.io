<div class="page" id="top">

  <!-- HERO: 3D desk -->
  <header class="hero hero-3d" id="home">
    <div class="desk-stage" id="desk-stage">
      <canvas id="desk-canvas" aria-label="Interactive 3D desk" role="img"></canvas>
      <div class="desk-loading" id="desk-loading"><i></i><span>Loading 3D…</span></div>
      <div class="desk-overlay">
        <div class="eyebrow" id="hero-eyebrow"></div>
        <h1 id="hero-title"></h1>
        <div class="typer" aria-live="polite"><span class="prompt">&gt;</span><span id="typer-text"></span><span class="cursor" aria-hidden="true"></span></div>
        <p class="lead" id="hero-lead"></p>
        <div class="cta" id="hero-cta"></div>
      </div>
      <div class="desk-tip" id="desk-tip" hidden></div>
      <div class="desk-bottom">
        <div class="desk-legend" id="desk-legend" role="group" aria-label="Desk objects"></div>
        <div class="desk-hint" id="desk-hint"></div>
      </div>
      <aside class="desk-panel" id="desk-panel" hidden aria-live="polite">
        <div class="desk-panel-head">
          <button class="desk-back" id="desk-back" type="button">← Back</button>
          <span class="desk-panel-esc"><kbd>Esc</kbd></span>
        </div>
        <div class="desk-panel-content" id="desk-panel-content"></div>
      </aside>
    </div>
    <div id="desk-videos" aria-hidden="true"></div>
  </header>

  <div class="wrap">
    <!-- ABOUT STRIP -->
    <div class="about-strip reveal" id="about">
      <aside class="hero-card" id="hero-card">
        <div class="avatar-wrap">
          <img class="avatar" src="assets/img/avatar.jpg" alt="Qinzhen Ma" width="88" height="88">
          <div class="avatar-meta">
            <div class="nm" id="avatar-name"></div>
            <div class="rl" id="avatar-role"></div>
            <div class="status"><i></i>OPEN TO COLLABORATION</div>
          </div>
        </div>
        <div class="facts" id="hero-facts"></div>
      </aside>
      <div>
        <p class="lead" id="about-lead"></p>
        <div class="stats" id="hero-stats"></div>
      </div>
    </div>

    <!-- STARTUP -->
    <section class="block reveal" id="startup">
      <div class="sh"><span class="n" id="startup-num"></span><h2 id="startup-title"></h2><div class="rule"></div></div>
      <div class="startup-card" id="startup-card"></div>
    </section>

    <!-- DELIVERY LOOP -->
    <section class="block reveal" id="loop">
      <div class="sh"><span class="n" id="loop-num"></span><h2 id="loop-title"></h2><div class="rule"></div></div>
      <p class="lead" id="loop-lead"></p>
      <div class="loop">
        <div class="loop-ring" id="loop-ring">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="track" cx="50" cy="50" r="42"/>
            <circle class="flow" cx="50" cy="50" r="42"/>
          </svg>
          <div class="loop-center" id="loop-center"></div>
          <div id="loop-nodes"></div>
        </div>
        <div class="loop-panel">
          <div class="loop-dots" id="loop-dots"></div>
          <div id="loop-panel-content"></div>
          <div class="loop-hint" id="loop-hint"></div>
        </div>
      </div>
    </section>

    <!-- EXPERIENCE + SKILLS -->
    <section class="block reveal" id="experience">
      <div class="two-col">
        <div>
          <div class="sh"><span class="n" id="exp-num"></span><h2 id="exp-title"></h2><div class="rule"></div></div>
          <p class="lead" id="exp-lead"></p>
          <div class="filters" id="exp-filters" role="tablist"></div>
          <div class="timeline" id="timeline"></div>
        </div>
        <div id="skills">
          <div class="sh"><span class="n" id="sk-num"></span><h2 id="sk-title"></h2><div class="rule"></div></div>
          <p class="lead" id="sk-lead"></p>
          <div id="sk-groups"></div>
          <h3 class="side-title" id="lead-title"></h3>
          <div class="lead-grid" id="lead-grid"></div>
        </div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section class="block reveal" id="projects">
      <div class="sh"><span class="n" id="pj-num"></span><h2 id="pj-title"></h2><div class="rule"></div></div>
      <p class="lead" id="pj-lead"></p>
      <h3 class="side-title" id="demo-title" style="margin-top:0"></h3>
      <div class="demo-grid" id="demo-grid"></div>
      <div class="pgrid" id="pgrid"></div>
    </section>

    <!-- EDUCATION -->
    <section class="block reveal" id="education">
      <div class="sh"><span class="n" id="edu-num"></span><h2 id="edu-title"></h2><div class="rule"></div></div>
      <div class="edu-grid" id="edu-grid"></div>
    </section>

    <!-- CONTACT -->
    <section class="block reveal" id="contact">
      <div class="sh"><span class="n" id="ct-num"></span><h2 id="ct-title"></h2><div class="rule"></div></div>
      <p class="lead" id="ct-lead"></p>
      <div class="contact-grid" id="contact-grid"></div>
    </section>

    <footer>
      <span id="footer-text"></span>
      <span id="footer-built"></span>
    </footer>
  </div>
